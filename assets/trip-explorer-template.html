<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Explorer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0ede6;--card:#fff;--text:#1a1a18;--muted:#6b6860;--accent:#1b5e3b;--accent2:#2563a8;--warn:#c44b25;--amber:#a16207;--border:rgba(0,0,0,.08);--r:14px;--font:'DM Sans',system-ui,sans-serif;--serif:'Instrument Serif',Georgia,serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55}
a{color:var(--accent2);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
.hero{background:linear-gradient(135deg,#1b5e3b 0%,#1e4d6b 100%);color:#fff;border-radius:var(--r);padding:32px 28px;margin-bottom:24px}
.hero h1{font-family:var(--serif);font-size:clamp(28px,5vw,40px);font-weight:400;line-height:1.15}
.hero .meta{opacity:.9;font-size:14px;margin-top:8px}
.urgency{background:#fdeee8;color:var(--warn);border-left:4px solid var(--warn);padding:12px 14px;border-radius:8px;margin-top:16px;font-size:13px}
h2{font-family:var(--serif);font-size:24px;margin:28px 0 12px;font-weight:400}
h3{font-size:16px;margin:24px 0 10px;font-weight:600}
.label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px}

/* Option cards — primary navigation */
.options{display:grid;gap:14px;margin-bottom:8px}
@media(min-width:720px){.options{grid-template-columns:repeat(3,1fr)}}
.opt-card{position:relative;border-radius:var(--r);overflow:hidden;cursor:pointer;min-height:260px;border:3px solid transparent;transition:transform .2s,border-color .2s,box-shadow .2s}
.opt-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.12)}
.opt-card.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt-card .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.opt-card .shade{position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.8))}
.opt-card .body{position:absolute;bottom:0;left:0;right:0;padding:16px;color:#fff;z-index:1}
.opt-card .body h3{font-family:var(--serif);font-size:19px;font-weight:400;color:#fff;margin:0 0 4px}
.opt-card .body p{font-size:13px;opacity:.92}
.opt-card .score{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.5);color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;z-index:1}
.opt-card .badge-wrap{position:absolute;top:12px;left:12px;z-index:1}

.badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:4px}
.b-recommended{background:#dceee4;color:var(--accent)}
.b-backup{background:#e8f0fa;color:var(--accent2)}
.b-adventurous{background:#fdf4e3;color:var(--amber)}
.b-type{background:#f0ede6;color:var(--muted)}

/* Gallery */
.gallery{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin:0 0 20px;scroll-snap-type:x mandatory}
.gallery::-webkit-scrollbar{height:5px}
.gallery::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
.gslide{flex:0 0 200px;scroll-snap-align:start;border-radius:10px;overflow:hidden;position:relative}
.gslide img{width:100%;height:140px;object-fit:cover;display:block;background:#e0ddd6}
.gslide span{position:absolute;bottom:0;left:0;right:0;padding:8px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:11px}

.grid{display:grid;gap:14px}
@media(min-width:640px){.grid-2{grid-template-columns:1fr 1fr}.grid-3{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px}
.stat strong{font-size:18px;display:block;margin-top:2px}
.score-bar{height:4px;background:#e8e6e0;border-radius:2px;margin-top:8px}
.score-fill{height:100%;background:var(--accent);border-radius:2px}

.prose{font-size:14px;margin-bottom:16px}
.prose.muted{color:var(--muted)}

.act{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.act img{width:100%;height:150px;object-fit:cover;display:block;background:#e0ddd6}
.act .inner{padding:14px}
.act h4{font-size:15px;margin-bottom:4px}
.meta{font-size:12px;color:var(--muted)}
.links{font-size:12px;margin-top:8px}

.lodge{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--card)}
.lodge img{width:88px;height:66px;object-fit:cover;border-radius:8px;background:#e0ddd6}
.lodge.s-book_now{border-color:var(--accent);background:#f8fcf9}
.lodge.s-viable{border-color:var(--amber)}
.lodge.s-needs_verification{border-style:dashed}

.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tab{padding:7px 13px;border:1px solid var(--border);background:var(--card);border-radius:8px;font-size:13px;cursor:pointer;font-family:var(--font)}
.tab.active{background:var(--text);color:#fff;border-color:var(--text)}
.plan-panel{display:none}.plan-panel.active{display:block}

.day{display:grid;gap:12px;margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
@media(min-width:600px){.day.has-img{grid-template-columns:120px 1fr}}
.day img{width:100%;height:90px;object-fit:cover;border-radius:10px;background:#e0ddd6}
@media(min-width:600px){.day.has-img img{height:100%;min-height:100px}}
.timeline{border-left:3px solid var(--accent);padding-left:16px}
.slot{margin-bottom:14px}
.slot .when{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase}
.slot h4{font-size:14px;margin:4px 0}
.slot p{font-size:13px;color:var(--muted)}

.map{height:260px;border-radius:var(--r);margin:16px 0;border:1px solid var(--border)}
.alert{background:#fdeee8;border-left:3px solid var(--warn);padding:10px 12px;border-radius:8px;font-size:13px;margin:8px 0}
.review{font-size:13px;border-left:3px solid var(--accent2);padding:10px 14px;margin:8px 0;background:var(--card);border-radius:0 8px 8px 0}
.review cite{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.group-msg{background:var(--card);padding:16px;border-radius:var(--r);font-size:14px;border:1px solid var(--border);white-space:pre-wrap}
.credits{font-size:10px;color:var(--muted);margin:-12px 0 16px}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
.img-fallback{background:linear-gradient(135deg,#2d5a3d,#3d6a8c);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);font-size:11px;min-height:66px}

.detail{display:none}
.detail.active{display:block}
.detail-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.back{font-size:13px;color:var(--accent2);cursor:pointer;border:none;background:none;font-family:var(--font);padding:0}
.back:hover{text-decoration:underline}
.overview.active ~ .detail-zone .detail{display:none}
.overview:not(.active) ~ .detail-zone .detail.active{display:block}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DATA = __TRIP_DATA__;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge = b => ({recommended:'b-recommended',backup:'b-backup',adventurous:'b-adventurous'}[b]||'b-backup');
const img = (url, alt, cls='') => url
  ? `<img class="${cls}" src="${esc(url)}" alt="${esc(alt||'')}" loading="lazy" onerror="this.outerHTML='<div class=img-fallback ${cls}>Photo</div>'">`
  : `<div class="img-fallback ${cls}">No photo</div>`;

function hero() {
  const m = DATA.meta || {};
  const t = m.travelers || {};
  return `<header class="hero">
    <h1>${esc(m.title||'Trip Explorer')}</h1>
    <div class="meta">${esc(m.dates||'')} · ${esc(m.origin||'')} · ${t.adults||'?'} adults · ${t.beds_min||2}+ beds</div>
    ${m.book_urgency ? `<div class="urgency">${esc(m.book_urgency)}</div>` : ''}
  </header>`;
}

function optionCards() {
  return `<div class="label">Choose a destination</div>
  <div class="options" id="options">${(DATA.options||[]).map(o => `
    <article class="opt-card" data-id="${esc(o.id)}">
      <div class="bg" style="background-image:url('${esc(o.hero_image||'')}')"></div>
      <div class="shade"></div>
      ${o.scores?.overall ? `<div class="score">${o.scores.overall.value}/5</div>` : ''}
      <div class="badge-wrap"><span class="badge ${badge(o.badge)}">${esc(o.badge||'')}</span></div>
      <div class="body">
        <h3>${esc(o.name)}</h3>
        <p>${esc(o.tagline||'')}</p>
        <p style="font-size:11px;margin-top:6px;opacity:.85">Fri ${esc(o.drive_friday?.hours||'?')} · ${esc(o.labor_day_risk||'')} crowd risk</p>
      </div>
    </article>`).join('')}</div>`;
}

function gallery(o) {
  const g = [...(o.gallery||[])];
  if (!g.length && o.hero_image) g.push({url:o.hero_image, caption:o.name});
  if (!g.length) return '';
  return `<div class="gallery">${g.map(x => `
    <div class="gslide">${img(x.url, x.caption)}<span>${esc(x.caption||'')}</span></div>`).join('')}</div>
    ${o.hero_credit ? `<div class="credits">Photos: ${esc(o.hero_credit)}</div>` : ''}`;
}

function optionDetail(o) {
  const plans = o.day_plans || [];
  const score = o.scores?.overall?.value || 0;
  return `<section class="detail" id="detail-${esc(o.id)}">
    <div class="detail-head">
      <h2>${esc(o.name)}</h2>
      <button class="back" data-back>← All options</button>
    </div>
    <p class="prose muted">${esc(o.tagline||'')}</p>
    ${gallery(o)}
    <div class="grid grid-3">
      <div class="stat"><div class="label">Friday drive</div><strong>${esc(o.drive_friday?.hours||'?')} hr</strong><div class="meta">${esc(o.drive_friday?.note||'')}</div></div>
      <div class="stat"><div class="label">Monday return</div><strong>${esc(o.drive_monday?.hours||'?')} hr</strong><div class="meta">${esc(o.drive_monday?.note||'')}</div></div>
      <div class="stat"><div class="label">Overall</div><strong>${score||'—'}/5</strong><div class="score-bar"><div class="score-fill" style="width:${(score/5)*100}%"></div></div></div>
    </div>
    ${o.strengths?.length ? `<p class="prose" style="margin-top:16px"><strong>Strengths:</strong> ${o.strengths.map(esc).join(' · ')}</p>` : ''}
    ${o.tradeoffs?.length ? `<p class="prose muted"><strong>Tradeoffs:</strong> ${o.tradeoffs.map(esc).join(' · ')}</p>` : ''}
    <div class="map" id="map-${esc(o.id)}"></div>
    <h3>Activities</h3>
    <div class="grid grid-2">${(o.activities||[]).map(a => `
      <article class="act">
        ${img(a.image, a.name)}
        <div class="inner">
          <span class="badge b-type">${esc(a.type||'activity')}</span>
          <h4>${esc(a.name)}</h4>
          <div class="meta">${[a.duration, a.distance_mi ? a.distance_mi+' mi' : '', a.crowd_level].filter(Boolean).map(esc).join(' · ')}</div>
          ${a.parking ? `<div class="meta" style="margin-top:4px">${esc(a.parking)}</div>` : ''}
          <div class="links">${a.official_url ? `<a href="${esc(a.official_url)}" target="_blank" rel="noopener">Official ↗</a> ` : ''}${a.maps_url ? `<a href="${esc(a.maps_url)}" target="_blank" rel="noopener">Maps ↗</a>` : ''}</div>
        </div>
      </article>`).join('')}</div>
    <h3>Where to stay</h3>
    ${(o.lodging||[]).map(l => `
      <div class="lodge s-${esc(l.status||'needs_verification')}">
        ${img(l.image, l.name)}
        <div>
          <strong>#${l.rank} ${esc(l.name)}</strong>
          <div class="meta">${esc(l.location||'')} · ${esc(l.beds||'')}${l.bed_fit==='green'?' · ✓ bed fit':''}</div>
          <div style="font-size:13px;margin-top:4px">${l.total_3_nights!=null?`<strong>$${l.total_3_nights}</strong> / 3 nights · `:''}${l.per_person!=null?`$${l.per_person}/person · `:''}${esc(l.availability||'')}</div>
          ${l.pros||l.cons ? `<div class="meta" style="margin-top:4px">${esc(l.pros||'')}${l.cons?' · '+esc(l.cons):''}</div>` : ''}
          ${l.booking_url ? `<div class="links"><a href="${esc(l.booking_url)}" target="_blank" rel="noopener">Book ↗</a></div>` : ''}
        </div>
      </div>`).join('')}
    <h3>Day plans</h3>
    <div class="tabs" data-opt="${esc(o.id)}">${plans.map((p,i) => `<button class="tab${i===0?' active':''}" data-plan="${esc(p.id)}">${esc(p.name)}</button>`).join('')}</div>
    ${plans.map((p,i) => `
      <div class="plan-panel${i===0?' active':''}" id="plan-${esc(o.id)}-${esc(p.id)}">
        ${p.vibe ? `<p class="prose muted">${esc(p.vibe)}</p>` : ''}
        ${(p.days||[]).map(d => `
          <div class="day${d.image?' has-img':''}">
            ${d.image ? img(d.image, d.label) : ''}
            <div class="timeline">
              <div class="slot"><div class="when">${esc(d.label||'')}</div>
              ${(d.blocks||[]).map(b => `
                <h4>${esc(b.time||'')} — ${esc(b.title||'')}</h4>
                <p>${esc(b.activity||'')}</p>
                <div class="meta">🚗 ${esc(b.drive_min||'?')} min · ⏱ ${esc(b.duration||'—')} · 🅿️ ${esc(b.parking||'—')}</div>
                ${b.backup ? `<div class="alert">Plan B: ${esc(b.backup)}</div>` : ''}
                <div class="links">${b.official_url ? `<a href="${esc(b.official_url)}" target="_blank" rel="noopener">Official ↗</a> ` : ''}${b.maps_url ? `<a href="${esc(b.maps_url)}" target="_blank" rel="noopener">Navigate ↗</a>` : ''}</div>
              `).join('')}
              </div>
            </div>
          </div>`).join('')}
      </div>`).join('')}
    ${(o.reviews||[]).length ? `<h3>Reviews</h3>${o.reviews.map(r => `<blockquote class="review">"${esc(r.quote)}"<cite>— <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.source)}</a></cite></blockquote>`).join('')}` : ''}
    ${o.reality_check && (o.reality_check.parking_targets?.length || o.reality_check.reservations?.length || o.reality_check.safety?.length) ? `
      <h3>Holiday reality check</h3>
      <div class="alert">
        ${o.reality_check.parking_targets?.length ? `<p><strong>Parking:</strong> ${o.reality_check.parking_targets.map(esc).join('; ')}</p>` : ''}
        ${o.reality_check.reservations?.length ? `<p><strong>Book ahead:</strong> ${o.reality_check.reservations.map(esc).join('; ')}</p>` : ''}
        ${o.reality_check.safety?.length ? `<p><strong>Safety:</strong> ${o.reality_check.safety.map(esc).join('; ')}</p>` : ''}
      </div>` : ''}
  </section>`;
}

function initMaps() {
  (DATA.options||[]).forEach(o => {
    const el = document.getElementById('map-'+o.id);
    if (!el || typeof L === 'undefined') return;
    const map = L.map(el, {scrollWheelZoom:false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OSM'}).addTo(map);
    const pts = [];
    (o.activities||[]).forEach(a => {
      if (typeof a.lat === 'number') { L.marker([a.lat,a.lng]).addTo(map).bindPopup(esc(a.name)); pts.push([a.lat,a.lng]); }
    });
    if (pts.length) map.fitBounds(pts, {padding:[24,24]});
    else map.setView([39.2,-120.5], 7);
  });
}

let overview = true;
function showOverview(scroll) {
  overview = true;
  document.getElementById('overview').classList.add('active');
  document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
  document.querySelectorAll('.opt-card').forEach(c => c.classList.remove('active'));
  if (scroll) document.getElementById('overview').scrollIntoView({behavior:'smooth'});
}

function showOption(id, scroll=true) {
  overview = false;
  document.getElementById('overview').classList.remove('active');
  document.querySelectorAll('.detail').forEach(d => d.classList.remove('active'));
  document.querySelectorAll('.opt-card').forEach(c => c.classList.toggle('active', c.dataset.id === id));
  document.getElementById('detail-'+id)?.classList.add('active');
  if (scroll) document.getElementById('detail-'+id)?.scrollIntoView({behavior:'smooth', block:'start'});
  setTimeout(() => { const m = window['_map_'+id]; if (m) m.invalidateSize(); }, 200);
}

function bind() {
  document.querySelectorAll('.opt-card').forEach(c => c.onclick = () => showOption(c.dataset.id));
  document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => showOverview(true));
  document.querySelectorAll('.tabs').forEach(bar => {
    const opt = bar.dataset.opt;
    bar.querySelectorAll('.tab').forEach(t => t.onclick = () => {
      bar.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      document.querySelectorAll(`[id^="plan-${opt}-"]`).forEach(p => p.classList.remove('active'));
      document.getElementById(`plan-${opt}-${t.dataset.plan}`)?.classList.add('active');
    });
  });
}

document.getElementById('app').innerHTML =
  hero() +
  `<div id="overview" class="overview active">${optionCards()}</div>` +
  `<div class="detail-zone">${(DATA.options||[]).map(optionDetail).join('')}</div>` +
  (DATA.group_message ? `<h2>Group message</h2><div class="group-msg">${esc(DATA.group_message)}</div>` : '') +
  `<footer>Generated ${esc(DATA.meta?.generated_at?.slice(0,10)||'')} · travel-agent</footer>`;

bind();
setTimeout(initMaps, 120);
</script>
</body>
</html>

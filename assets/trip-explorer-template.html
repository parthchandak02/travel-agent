<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Explorer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1eb;--card:#fff;--text:#1a1a18;--muted:#6b6860;--accent:#1b5e3b;--accent2:#2563a8;--warn:#c44b25;--amber:#a16207;--border:rgba(0,0,0,.08);--r:12px;--font:'DM Sans',system-ui,sans-serif;--serif:'Instrument Serif',Georgia,serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5}
a{color:var(--accent2);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 80px}
.hero{background:linear-gradient(135deg,#1b5e3b 0%,#2563a8 100%);color:#fff;border-radius:var(--r);padding:32px 28px;margin-bottom:24px}
.hero h1{font-family:var(--serif);font-size:clamp(28px,5vw,40px);font-weight:400;margin-bottom:6px}
.hero .sub{opacity:.85;font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{background:rgba(255,255,255,.15);padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500}
.urgency{background:#fdeee8;color:var(--warn);border-left:4px solid var(--warn);padding:14px 16px;border-radius:8px;margin:20px 0;font-size:14px}
.nav-sticky{position:sticky;top:0;z-index:100;background:rgba(244,241,235,.95);backdrop-filter:blur(8px);padding:10px 0;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--border);display:flex;gap:8px;overflow-x:auto}
.nav-sticky button{border:1px solid var(--border);background:var(--card);padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:var(--font)}
.nav-sticky button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
h2{font-family:var(--serif);font-size:24px;margin:28px 0 14px;font-weight:400}
.grid{display:grid;gap:16px}
@media(min-width:700px){.grid-3{grid-template-columns:repeat(3,1fr)}.grid-2{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.08);transform:translateY(-2px)}
.card-img{height:140px;background:linear-gradient(135deg,#dceee4,#e8f0fa);object-fit:cover;width:100%}
.card-body{padding:16px}
.card h3{font-size:17px;margin-bottom:4px}
.badge{display:inline-block;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:4px;margin-bottom:8px}
.b-recommended{background:#dceee4;color:var(--accent)}
.b-backup{background:#e8f0fa;color:var(--accent2)}
.b-fragile{background:#fdeee8;color:var(--warn)}
.b-adventurous{background:#fdf4e3;color:var(--amber)}
.score-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border)}
.score-bar{height:4px;background:#e8e6e0;border-radius:2px;margin-top:2px}
.score-fill{height:100%;background:var(--accent);border-radius:2px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:var(--r);overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:#ebe8e0;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.opt-panel{display:none}.opt-panel.active{display:block}
.tabs{display:flex;gap:4px;margin:12px 0;flex-wrap:wrap}
.tab{padding:8px 14px;border:1px solid var(--border);background:var(--card);border-radius:8px;font-size:13px;cursor:pointer;font-family:var(--font)}
.tab.active{background:var(--text);color:#fff;border-color:var(--text)}
.plan-panel{display:none}.plan-panel.active{display:block}
.timeline{border-left:3px solid var(--accent);margin-left:8px;padding-left:20px}
.block{margin-bottom:20px;position:relative}
.block::before{content:'';position:absolute;left:-26px;top:6px;width:10px;height:10px;background:var(--accent);border-radius:50%}
.block .time{font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase}
.block h4{font-size:15px;margin:4px 0}
.block p{font-size:13px;color:var(--muted)}
.block .links{margin-top:6px;font-size:12px}
.lodge{padding:14px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px}
.lodge.s-book_now{border-color:var(--accent);background:#f8fcf9}
.lodge.s-viable{border-color:var(--amber)}
.lodge.s-eliminate{opacity:.5}
.lodge.s-needs_verification{border-style:dashed}
.review{font-size:13px;border-left:3px solid var(--accent2);padding:10px 14px;margin:10px 0;background:var(--card);border-radius:0 8px 8px 0}
.review cite{display:block;font-size:11px;color:var(--muted);margin-top:6px}
#map{height:320px;border-radius:var(--r);margin:16px 0}
.alert{background:#fdeee8;border-left:3px solid var(--warn);padding:12px 14px;border-radius:8px;font-size:13px;margin:10px 0}
.group-msg{background:var(--card);padding:16px;border-radius:var(--r);font-size:14px;border:1px solid var(--border);white-space:pre-wrap}
footer{margin-top:40px;font-size:11px;color:var(--muted)}
.sources{font-size:12px;color:var(--muted);margin-top:20px}
.sources li{margin:4px 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DATA = __TRIP_DATA__;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (h) => { const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild; };
const badgeCls = b => ({recommended:'b-recommended',backup:'b-backup',fragile:'b-fragile',adventurous:'b-adventurous'}[b]||'b-backup');

function renderHero() {
  const m = DATA.meta || {};
  const rec = (DATA.options||[]).find(o=>o.id===m.recommended_option_id);
  const bak = (DATA.options||[]).find(o=>o.id===m.backup_option_id);
  return `<div class="hero">
    <h1>${esc(m.title||'Trip Explorer')}</h1>
    <div class="sub">${esc(m.dates||'')} · ${esc(m.origin||'')} · ${m.travelers?.adults||'?'} adults</div>
    <div class="pills">
      ${rec?`<span class="pill">★ ${esc(rec.name)}</span>`:''}
      ${bak?`<span class="pill">Backup: ${esc(bak.name)}</span>`:''}
      <span class="pill">${(DATA.options||[]).length} options</span>
    </div>
    ${m.book_urgency?`<div class="urgency" style="margin-top:16px;background:rgba(255,255,255,.15);color:#fff;border-color:#fff">⏰ ${esc(m.book_urgency)}</div>`:''}
  </div>`;
}

function renderCompare() {
  const opts = DATA.options||[];
  const dims = ['friday_drive','monday_return','lodging_value','crowd_resilience','water_quality','hiking_quality','scenic_uniqueness','town_food','safety_reliability','overall'];
  const labels = {friday_drive:'Fri drive',monday_return:'Mon return',lodging_value:'Lodging',crowd_resilience:'Crowds',water_quality:'Water',hiking_quality:'Hiking',scenic_uniqueness:'Scenic',town_food:'Town/food',safety_reliability:'Safety',overall:'Overall'};
  let rows = opts.map(o => {
    const cells = dims.map(d => {
      const s = o.scores?.[d];
      const v = s?.value ?? '—';
      return `<td>${v}</td>`;
    }).join('');
    return `<tr><td><strong>${esc(o.name)}</strong></td>${cells}</tr>`;
  }).join('');
  const hdr = dims.map(d=>`<th>${labels[d]||d}</th>`).join('');
  return `<h2>Compare options</h2>
    <div class="grid grid-3" style="margin-bottom:24px">${opts.map(o=>`
      <div class="card" data-goto="${esc(o.id)}">
        ${o.hero_image?`<img class="card-img" src="${esc(o.hero_image)}" alt="" onerror="this.style.display='none'">`:''}
        <div class="card-body">
          <span class="badge ${badgeCls(o.badge)}">${esc(o.badge||'option')}</span>
          <h3>${esc(o.name)}</h3>
          <p style="font-size:13px;color:var(--muted)">${esc(o.tagline||'')}</p>
          <p style="font-size:12px;margin-top:8px">Fri ${esc(o.drive_friday?.hours||'?')} · Risk: ${esc(o.labor_day_risk||'?')}</p>
          ${o.scores?.overall?`<div class="score-row"><span>Overall</span><strong>${o.scores.overall.value}/5</strong></div><div class="score-bar"><div class="score-fill" style="width:${(o.scores.overall.value/5)*100}%"></div></div>`:''}
        </div>
      </div>`).join('')}
    </div>
    <table><thead><tr><th>Option</th>${hdr}</tr></thead><tbody>${rows}</tbody></table>`;
}

function renderOption(o) {
  const plans = o.day_plans||[];
  const lodges = o.lodging||[];
  const acts = o.activities||[];
  const reviews = o.reviews||[];
  const rc = o.reality_check||{};
  return `<div class="opt-panel" id="panel-${esc(o.id)}">
    <h2>${esc(o.name)}</h2>
    <p style="color:var(--muted);margin-bottom:16px">${esc(o.tagline||'')}</p>
    ${o.strengths?.length?`<p><strong>Strengths:</strong> ${o.strengths.map(esc).join(' · ')}</p>`:''}
    ${o.tradeoffs?.length?`<p style="margin-top:6px"><strong>Tradeoffs:</strong> ${o.tradeoffs.map(esc).join(' · ')}</p>`:''}
    <div id="map-${esc(o.id)}" style="height:280px;border-radius:12px;margin:16px 0"></div>
    <h3 style="font-size:18px;margin-top:20px">Activities</h3>
    <div class="grid grid-2">${acts.map(a=>`
      <div class="card"><div class="card-body">
        <span class="badge b-adventurous">${esc(a.type||'activity')}</span>
        <h3>${esc(a.name)}</h3>
        <p style="font-size:13px">${esc(a.duration||'')} ${a.distance_mi?`· ${a.distance_mi} mi`:''} · ${esc(a.crowd_level||'')}</p>
        <p style="font-size:12px;color:var(--muted);margin-top:6px">${esc(a.parking||'')}</p>
        <div class="links">${a.official_url?`<a href="${esc(a.official_url)}" target="_blank">Official ↗</a> `:''}${a.maps_url?`<a href="${esc(a.maps_url)}" target="_blank">Maps ↗</a>`:''}</div>
        ${a.review_snippet?`<div class="review" style="margin-top:10px;font-size:12px">"${esc(a.review_snippet)}"</div>`:''}
      </div></div>`).join('')}</div>
    <h3 style="font-size:18px;margin-top:24px">Lodging (${lodges.length})</h3>
    ${lodges.map(l=>`
      <div class="lodge s-${esc(l.status||'needs_verification')}">
        <strong>#${l.rank||'?'} ${esc(l.name)}</strong> — ${esc(l.location||'')}
        <div style="font-size:13px;color:var(--muted);margin-top:4px">
          ${l.total_3_nights!=null?`$${l.total_3_nights} total · `:''}
          ${l.per_person!=null?`$${l.per_person}/person · `:''}
          ${esc(l.beds||'')} · ${esc(l.availability||'')}
        </div>
        <div style="font-size:12px;margin-top:6px">${esc(l.pros||'')} ${l.cons?'· '+esc(l.cons):''}</div>
        ${l.booking_url?`<div style="margin-top:8px"><a href="${esc(l.booking_url)}" target="_blank">Book ↗</a></div>`:''}
      </div>`).join('')}
    <h3 style="font-size:18px;margin-top:24px">Day plans</h3>
    <div class="tabs" data-opt="${esc(o.id)}">${plans.map((p,i)=>`<button class="tab${i===0?' active':''}" data-plan="${esc(p.id)}">${esc(p.name)}</button>`).join('')}</div>
    ${plans.map((p,i)=>`
      <div class="plan-panel${i===0?' active':''}" id="plan-${esc(o.id)}-${esc(p.id)}">
        <p style="font-size:13px;color:var(--muted);margin-bottom:12px">${esc(p.vibe||'')}</p>
        <div class="timeline">${(p.days||[]).map(d=>`
          <div class="block"><div class="time">${esc(d.label||d.date||'')}</div>
          ${(d.blocks||[]).map(b=>`
            <h4>${esc(b.time||'')} — ${esc(b.title||'')}</h4>
            <p>${esc(b.activity||'')}</p>
            <p style="font-size:12px">Drive ${esc(b.drive_min||'?')} min · ${esc(b.duration||'')} · Park: ${esc(b.parking||'—')}</p>
            ${b.backup?`<div class="alert">Plan B: ${esc(b.backup)}</div>`:''}
            <div class="links">${b.official_url?`<a href="${esc(b.official_url)}" target="_blank">Official ↗</a> `:''}${b.maps_url?`<a href="${esc(b.maps_url)}" target="_blank">Navigate ↗</a>`:''}</div>
          `).join('')}
          </div>`).join('')}
        </div>
      </div>`).join('')}
    <h3 style="font-size:18px;margin-top:24px">Reviews</h3>
    ${reviews.map(r=>`<div class="review">"${esc(r.quote)}"<cite>— <a href="${esc(r.url)}" target="_blank">${esc(r.source)}</a> ${esc(r.date||'')}</cite></div>`).join('')||'<p style="color:var(--muted)">No reviews collected.</p>'}
    <h3 style="font-size:18px;margin-top:24px">Labor Day reality check</h3>
    <div class="alert">
      ${rc.parking_targets?.length?`<p><strong>Parking:</strong> ${rc.parking_targets.map(esc).join('; ')}</p>`:''}
      ${rc.reservations?.length?`<p><strong>Reservations:</strong> ${rc.reservations.map(esc).join('; ')}</p>`:''}
      ${rc.safety?.length?`<p><strong>Safety:</strong> ${rc.safety.map(esc).join('; ')}</p>`:''}
    </div>
  </div>`;
}

function initMaps() {
  (DATA.options||[]).forEach(o => {
    const el = document.getElementById('map-'+o.id);
    if (!el || typeof L==='undefined') return;
    const map = L.map(el, {scrollWheelZoom:false});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OSM'}).addTo(map);
    const pts = [];
    (o.activities||[]).forEach((a,i) => {
      if (typeof a.lat==='number' && typeof a.lng==='number') {
        L.marker([a.lat,a.lng]).addTo(map).bindPopup(esc(a.name));
        pts.push([a.lat,a.lng]);
      }
    });
    if (pts.length) map.fitBounds(pts,{padding:[30,30]});
    else map.setView([39.2,-120.5],7);
  });
}

function bindUI() {
  document.querySelectorAll('[data-goto]').forEach(c => {
    c.style.cursor='pointer';
    c.onclick = () => showOpt(c.dataset.goto);
  });
  document.querySelectorAll('.nav-sticky button').forEach(b => {
    b.onclick = () => showOpt(b.dataset.opt);
  });
  document.querySelectorAll('.tabs').forEach(tabBar => {
    const opt = tabBar.dataset.opt;
    tabBar.querySelectorAll('.tab').forEach(t => {
      t.onclick = () => {
        tabBar.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
        t.classList.add('active');
        document.querySelectorAll(`[id^="plan-${opt}-"]`).forEach(p=>p.classList.remove('active'));
        document.getElementById(`plan-${opt}-${t.dataset.plan}`)?.classList.add('active');
      };
    });
  });
}

function showOpt(id) {
  document.querySelectorAll('.opt-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+id)?.classList.add('active');
  document.querySelectorAll('.nav-sticky button').forEach(b=>{
    b.classList.toggle('active', b.dataset.opt===id);
  });
  document.getElementById('panel-'+id)?.scrollIntoView({behavior:'smooth',block:'start'});
}

const app = document.getElementById('app');
const navBtns = (DATA.options||[]).map(o=>`<button data-opt="${esc(o.id)}">${esc(o.name.split(' ')[0])}</button>`).join('');
app.innerHTML = renderHero()
  + `<div class="nav-sticky">${navBtns}</div>`
  + `<section id="compare">${renderCompare()}</section>`
  + `<section id="details">${(DATA.options||[]).map(renderOption).join('')}</section>`
  + (DATA.group_message?`<h2>Group message</h2><div class="group-msg">${esc(DATA.group_message)}</div>`:'')
  + (DATA.sources_checked?.length?`<div class="sources"><h3 style="font-size:14px">Sources checked</h3><ul>${DATA.sources_checked.map(s=>`<li><a href="${esc(s.url)}" target="_blank">${esc(s.name)}</a> — ${esc(s.checked_at||'')}</li>`).join('')}</ul></div>`:'')
  + `<footer>Generated ${esc(DATA.meta?.generated_at||'')} · travel-agent skill</footer>`;

if ((DATA.options||[]).length) {
  document.getElementById('panel-'+DATA.options[0].id)?.classList.add('active');
  document.querySelector('.nav-sticky button')?.classList.add('active');
}
bindUI();
setTimeout(initMaps, 100);
</script>
</body>
</html>

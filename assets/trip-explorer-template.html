<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trip Explorer</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0ede6;--surface:#fff;--surface-warn:#faf4f0;
  --text:#1a1a18;--muted:#6b6860;--accent:#1b5e3b;--warn:#b8472a;
  --hairline:rgba(26,26,24,.08);
  --space-2:8px;--space-4:16px;--space-6:24px;--space-10:40px;--space-16:64px;
  --radius:12px;--radius-lg:16px;
  --shadow-sm:0 1px 3px rgba(26,26,24,.06);
  --shadow-md:0 8px 28px rgba(26,26,24,.1);
  --font:'DM Sans',system-ui,sans-serif;--serif:'Instrument Serif',Georgia,serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --bar-h:56px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:72px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1040px;margin:0 auto;padding:var(--space-6) var(--space-4) var(--space-16)}

.hero{background:linear-gradient(135deg,#1b5e3b,#1a3d52);color:#fff;border-radius:var(--radius-lg);padding:var(--space-10) var(--space-6);margin-bottom:var(--space-4);box-shadow:var(--shadow-md)}
.hero h1{font-family:var(--serif);font-size:clamp(2rem,5vw,2.75rem);font-weight:400;line-height:1.1}
.hero .meta{opacity:.9;font-size:14px;margin-top:var(--space-2)}
.urgency{background:var(--surface-warn);color:var(--warn);padding:var(--space-4);border-radius:var(--radius);margin-top:var(--space-4);font-size:13px;line-height:1.5}

/* Sticky destination chrome */
.chrome{position:sticky;top:0;z-index:90;background:rgba(240,237,230,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--hairline);margin:0 calc(-1 * var(--space-4)) var(--space-6);padding:var(--space-2) var(--space-4);display:flex;gap:var(--space-2);overflow-x:auto;scrollbar-width:none}
.chrome::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 16px;border-radius:999px;font:600 13px/1 var(--font);cursor:pointer;background:var(--surface);border:none;box-shadow:var(--shadow-sm);color:var(--text);transition:background .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease)}
.chip:hover{box-shadow:var(--shadow-md)}
.chip.active{background:var(--accent);color:#fff}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.section-head{margin:var(--space-10) 0 var(--space-4)}
.section-head h2,.section-head h3{font-family:var(--serif);font-weight:400}
.section-head h2{font-size:clamp(1.5rem,3vw,1.875rem)}
.section-head h3{font-size:1.375rem}
.section-deck{font-size:13px;color:var(--muted);margin-top:6px}
.label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}

/* Option cards */
.options{display:grid;gap:var(--space-4);margin-bottom:var(--space-6)}
@media(min-width:720px){.options{grid-template-columns:repeat(3,1fr)}}
.opt-card{position:relative;border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;min-height:272px;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.opt-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--accent);transform:scaleX(0);transition:transform .25s var(--ease)}
.opt-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md)}
.opt-card.active::after,.mode-weekend .opt-card[data-id].active::after{transform:scaleX(1)}
.opt-card .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.opt-card .shade{position:absolute;inset:0;background:linear-gradient(transparent 38%,rgba(0,0,0,.82))}
.opt-card .body{position:absolute;bottom:0;left:0;right:0;padding:var(--space-4);color:#fff;z-index:1}
.opt-card .body h3{font-family:var(--serif);font-size:1.25rem;font-weight:400;color:#fff;margin-bottom:4px}
.opt-card .body p{font-size:13px;opacity:.92}
.opt-card .score{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.45);color:#fff;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;z-index:1}
.badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px;border-radius:4px}
.b-recommended{background:#dceee4;color:var(--accent)}
.b-backup{background:#e8f0fa;color:#1e4d6b}
.b-adventurous{background:#fdf4e3;color:#8a5a00}

/* Compare table */
.compare-wrap{overflow-x:auto;margin-bottom:var(--space-6);-webkit-overflow-scrolling:touch}
.compare{width:100%;min-width:560px;border-collapse:collapse;font-size:13px}
.compare th,.compare td{padding:var(--space-4);text-align:left;vertical-align:top;border-top:1px solid var(--hairline)}
.compare thead th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-top:none;padding-bottom:var(--space-2)}
.compare thead th:not(:first-child){font-family:var(--serif);font-size:1.125rem;font-weight:400;text-transform:none;letter-spacing:0;color:var(--text);cursor:pointer}
.compare thead th:not(:first-child):hover{color:var(--accent)}
.compare tbody th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);width:7.5rem;white-space:nowrap}
.compare tbody td{cursor:pointer;transition:background .15s}
.compare tbody tr:hover td{background:rgba(27,94,59,.04)}
.compare .col-active{background:rgba(27,94,59,.06)}
.mode-weekend #compare-panel{display:none}

.group-msg{background:var(--surface);padding:var(--space-6);border-radius:var(--radius-lg);font-size:14px;line-height:1.6;white-space:pre-wrap;box-shadow:var(--shadow-sm);margin-bottom:var(--space-6)}

/* Detail view */
.mode-compare #detail-panel{display:none}
.detail-head{margin-bottom:var(--space-4)}
.detail-head h2{font-family:var(--serif);font-size:clamp(1.5rem,3vw,2rem);font-weight:400}
.detail-zone .detail{display:none}
.detail-zone .detail.active{display:block}

/* Plan picker cards */
.plan-cards{display:grid;gap:var(--space-4);margin:var(--space-6) 0}
@media(min-width:640px){.plan-cards{grid-template-columns:repeat(3,1fr)}}
.plan-card{padding:var(--space-4);background:var(--surface);border-radius:var(--radius);cursor:pointer;box-shadow:var(--shadow-sm);transition:box-shadow .2s var(--ease),transform .2s var(--ease);border-bottom:3px solid transparent}
.plan-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.plan-card.active{border-bottom-color:var(--accent)}
.plan-card h4{font-family:var(--serif);font-size:1.125rem;font-weight:400;margin-bottom:var(--space-2)}
.plan-card .day-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--space-2)}
.plan-card .day-chip{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:4px 8px;border-radius:4px;background:rgba(27,94,59,.08);color:var(--accent)}
.plan-card .plan-vibe{font-size:12px;color:var(--muted);line-height:1.45}

.gallery{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:var(--space-6);scroll-snap-type:x mandatory}
.gslide{flex:0 0 210px;scroll-snap-align:start;border-radius:var(--radius);overflow:hidden;position:relative;box-shadow:var(--shadow-sm)}
.gslide img{width:100%;height:132px;object-fit:cover;display:block;background:#e0ddd6}
.gslide span{position:absolute;bottom:0;left:0;right:0;padding:8px;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:11px}

.stats{display:grid;gap:var(--space-4);margin:var(--space-6) 0}
@media(min-width:640px){.stats{grid-template-columns:1fr 1fr 1fr;gap:0}}
.stat{padding:var(--space-2) 0}
@media(min-width:640px){.stat{padding:0 var(--space-6)}.stat:not(:last-child){border-right:1px solid var(--hairline)}.stat:first-child{padding-left:0}.stat:last-child{padding-right:0}}
.stat strong{font-family:var(--serif);font-size:1.5rem;font-weight:400;display:block;margin-top:2px}
.score-bar{height:3px;background:rgba(27,94,59,.12);border-radius:2px;margin-top:10px;max-width:120px}
.score-fill{height:100%;background:var(--accent);border-radius:2px}

.prose{font-size:14px;line-height:1.6;margin:var(--space-4) 0}
.prose.muted{color:var(--muted)}

.map{height:280px;border-radius:var(--radius-lg);margin:var(--space-6) 0;box-shadow:var(--shadow-sm);overflow:hidden}

/* Lodging collapsed */
.lodge-details summary{cursor:pointer;font-family:var(--serif);font-size:1.125rem;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-4);padding:var(--space-4) 0}
.lodge-details summary::-webkit-details-marker{display:none}
.lodge-details summary::after{content:'+';font-family:var(--font);font-size:18px;color:var(--muted)}
.lodge-details[open] summary::after{content:'−'}
.lodge-list{list-style:none}
.lodge-row{display:grid;grid-template-columns:32px 1fr auto;grid-template-areas:"rank main price" "rank main cta";gap:4px var(--space-4);padding:var(--space-4) 0;align-items:start}
.lodge-row+.lodge-row{border-top:1px solid var(--hairline)}
.lodge-rank{grid-area:rank;font-family:var(--serif);font-size:1.5rem;color:var(--muted);line-height:1}
.lodge-row--pick .lodge-rank{color:var(--accent)}
.lodge-main{grid-area:main;min-width:0}
.lodge-title{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:4px}
.lodge-title h4{font-size:15px;font-weight:600}
.lodge-status{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.lodge-meta,.lodge-note{font-size:12px;color:var(--muted)}
.lodge-beds{font-size:13px;margin-top:4px}
.lodge-beds--ok{color:var(--accent)}
.lodge-beds--warn{color:#8a5a00}
.lodge-price{grid-area:price;text-align:right;white-space:nowrap}
.lodge-total{font-family:var(--serif);font-size:1.25rem;font-weight:400;display:block}
.lodge-pp{font-size:11px;color:var(--muted)}
.lodge-cta{grid-area:cta;justify-self:end;align-self:center;padding:8px 16px;background:var(--accent);color:#fff;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none}
.lodge-cta:hover{text-decoration:none;filter:brightness(1.05)}
.lodge-cta--ghost{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1px var(--hairline)}
.lodge-more{font-size:13px;color:var(--accent);padding:var(--space-2) 0;cursor:pointer;background:none;border:none;font-family:var(--font)}
@media(max-width:640px){
  .lodge-row{grid-template-columns:28px 1fr;grid-template-areas:"rank main" ". price" ". cta"}
  .lodge-price{text-align:left}.lodge-cta{justify-self:stretch;text-align:center}
}

/* Day itinerary — editorial */
.itinerary{margin-top:var(--space-6)}
.plan-empty{text-align:center;padding:var(--space-10) var(--space-4);color:var(--muted);font-size:14px}
.day{max-width:42rem;margin:0 auto var(--space-10)}
.day-masthead img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:2px;display:block;background:#e0ddd6;margin-bottom:0}
.day-kicker{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:var(--space-6) 0 4px}
.day-title{font-family:var(--serif);font-size:clamp(1.75rem,4vw,2.25rem);font-weight:400;line-height:1.15}
.day-summary{font-size:14px;color:var(--muted);margin-top:6px}
.schedule{list-style:none;margin-top:var(--space-6)}
.block{display:grid;grid-template-columns:4.5rem 1fr;gap:0 var(--space-4);padding:var(--space-6) 0;border-top:1px solid var(--hairline);position:relative}
.block__time{font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.block__body{position:relative;padding-left:var(--space-4)}
.block__body::before{content:'';position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.block__title{font-family:var(--serif);font-size:1.25rem;font-weight:400;margin-bottom:6px;line-height:1.25}
.block__activity{font-size:15px;margin-bottom:var(--space-4)}
.block__meta{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12px;color:var(--muted);margin-bottom:var(--space-2)}
.block__meta span strong{font-weight:600;color:var(--text)}
.block__links{font-size:12px;margin-top:var(--space-2)}
.block__links a+a::before{content:' · ';color:var(--muted)}
.block__backup{margin-top:var(--space-4);padding-left:12px;border-left:2px solid var(--accent);font-size:13px;color:var(--muted)}
.backup-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:4px}
@media(max-width:520px){
  .block{grid-template-columns:1fr}
  .block__time{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:4px}
  .block__body{padding-left:14px}
}

/* Collapsible extras in detail */
.detail-extra{margin-top:var(--space-6)}
.detail-extra summary{cursor:pointer;font-family:var(--serif);font-size:1.125rem;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:var(--space-4);padding:var(--space-4) 0;border-top:1px solid var(--hairline)}
.detail-extra summary::-webkit-details-marker{display:none}
.detail-extra summary::after{content:'+';font-family:var(--font);font-size:18px;color:var(--muted)}
.detail-extra[open] summary::after{content:'−'}

.act-ref{margin-top:var(--space-2)}
.act-list{list-style:none}
.act-row{display:grid;grid-template-columns:72px 1fr;gap:12px var(--space-4);padding:var(--space-4) 0}
.act-row+.act-row{border-top:1px solid var(--hairline)}
.act-row img{width:72px;height:72px;object-fit:cover;border-radius:8px;background:#e0ddd6}
.act-kicker{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.act-day{font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.act-name{font-size:15px;font-weight:600;margin-bottom:2px}
.act-meta{font-size:12px;color:var(--muted)}
.act-links{font-size:12px;margin-top:6px}

.review{margin:var(--space-6) 0;padding:0;max-width:36rem}
.review p{font-family:var(--serif);font-size:17px;line-height:1.55;position:relative;padding-left:1.25rem}
.review p::before{content:'\201C';position:absolute;left:0;top:-4px;font-size:2rem;color:var(--accent);opacity:.35;line-height:1}
.review cite{display:block;font-family:var(--font);font-size:12px;color:var(--muted);margin-top:8px;font-style:normal}

.reality{background:var(--surface-warn);padding:var(--space-4) var(--space-6);border-radius:var(--radius);font-size:13px;line-height:1.6}
.reality p+p{margin-top:8px}
.reality strong{font-weight:600;color:var(--text)}

.credits{font-size:10px;color:var(--muted);margin-top:-12px;margin-bottom:var(--space-4)}
footer{margin-top:var(--space-16);font-size:11px;color:var(--muted)}
.img-fallback{background:linear-gradient(135deg,#2d5a3d,#3d6a8c);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.55);font-size:11px;min-height:72px}

/* Mobile bottom dock */
.dock{position:fixed;bottom:0;left:0;right:0;z-index:100;display:flex;height:var(--bar-h);background:var(--surface);border-top:1px solid var(--hairline);box-shadow:0 -4px 20px rgba(26,26,24,.06)}
.dock-btn{flex:1;display:flex;align-items:center;justify-content:center;font:600 13px/1 var(--font);color:var(--text);background:none;border:none;cursor:pointer;text-decoration:none}
.dock-btn+.dock-btn{border-left:1px solid var(--hairline)}
.dock-btn.active{color:var(--accent)}
.dock-btn--map{color:var(--accent)}
.dock-btn[disabled],.dock-btn--disabled{opacity:.35;pointer-events:none}
@media(min-width:900px){.dock{display:none}body{padding-bottom:0}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="dock" id="dock" aria-label="Trip navigation"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const DATA = __TRIP_DATA__;
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge = b => ({recommended:'b-recommended',backup:'b-backup',adventurous:'b-adventurous'}[b]||'b-backup');
const img = (url, alt, cls='') => url
  ? `<img class="${cls}" src="${esc(url)}" alt="${esc(alt||'')}" loading="lazy" onerror="this.outerHTML='<div class=img-fallback ${cls}>Photo</div>'">`
  : '';

const state = { mode: 'compare', optionId: null, planId: null };
const maps = {};

const fmtTime = t => {
  if (!t || t === '—') return '';
  const m = String(t).match(/^(\d{1,2}):(\d{2})$/);
  if (!m) return t;
  let h = +m[1], ap = 'AM';
  if (h >= 12) { ap = 'PM'; if (h > 12) h -= 12; }
  if (h === 0) h = 12;
  return `${h}:${m[2]} ${ap}`;
};

const daySummary = blocks => {
  const n = (blocks||[]).length;
  const drive = (blocks||[]).reduce((s,b) => s + (parseInt(b.drive_min,10)||0), 0);
  const parts = [`${n} stop${n!==1?'s':''}`];
  if (drive) parts.push(`~${Math.round(drive/60*10)/10} hr driving`);
  return parts.join(' · ');
};

const bedLine = l => {
  const fit = l.bed_fit;
  const cls = fit==='green'?'lodge-beds--ok':fit==='yellow'||fit==='needs_verification'?'lodge-beds--warn':'';
  const note = fit==='green'?' · fits 3 adults':fit==='yellow'||fit==='needs_verification'?' · verify bed layout':fit==='red'?' · may not fit group':'';
  return `<p class="lodge-beds ${cls}"><strong>${esc(l.beds||'Beds TBD')}</strong>${note}</p>`;
};

function shortName(o) {
  if (o.base_towns?.[0]) return o.base_towns[0];
  const n = o.name || '';
  if (/bucks lake/i.test(n)) return 'Bucks Lake';
  if (/downieville/i.test(n)) return 'Downieville';
  if (/nevada city/i.test(n)) return 'Nevada City';
  return (n.split(/[&,]/)[0] || n).trim().slice(0, 18);
}

function bestStay(o) {
  return (o.lodging || [])
    .filter(l => l.total_3_nights != null)
    .sort((a, b) => a.total_3_nights - b.total_3_nights)[0] || null;
}

function defaultPlanId(o) {
  return (o.day_plans || [])[0]?.id || 'plan-a';
}

function getOption(id) {
  return (DATA.options || []).find(o => o.id === id);
}

function hero() {
  const m = DATA.meta || {}, t = m.travelers || {};
  return `<header class="hero">
    <h1>${esc(m.title||'Trip Explorer')}</h1>
    <div class="meta">${esc(m.dates||'')} · ${esc(m.origin||'')} · ${t.adults||'?'} adults · ${t.beds_min||2}+ beds</div>
    ${m.book_urgency?`<div class="urgency">${esc(m.book_urgency)}</div>`:''}
  </header>`;
}

function chromeBar() {
  const opts = DATA.options || [];
  return `<nav class="chrome" id="chrome" aria-label="Destinations">${opts.map(o => `
    <button type="button" class="chip" data-chip="${esc(o.id)}">${esc(shortName(o))}</button>`).join('')}
  </nav>`;
}

function optionCards() {
  return `<p class="label">Step 1 · Pick a destination</p>
  <div class="options">${(DATA.options||[]).map(o=>`
    <article class="opt-card" data-id="${esc(o.id)}" tabindex="0" role="button" aria-label="Explore ${esc(shortName(o))}">
      <div class="bg" style="background-image:url('${esc(o.hero_image||'')}')"></div>
      <div class="shade"></div>
      ${o.scores?.overall?`<div class="score">${o.scores.overall.value}/5</div>`:''}
      <div class="body">
        <span class="badge ${badge(o.badge)}">${esc(o.badge||'')}</span>
        <h3>${esc(shortName(o))}</h3>
        <p>${esc(o.tagline||'')}</p>
        <p style="font-size:11px;margin-top:6px;opacity:.85">Fri ${esc(o.drive_friday?.hours||'?')} · ${esc(o.labor_day_risk||'')} crowd</p>
      </div>
    </article>`).join('')}</div>`;
}

function compareTable() {
  const opts = DATA.options || [];
  const rows = [
    { key: 'best', label: 'Best for', val: o => (o.strengths||[])[0] || o.tagline || '—' },
    { key: 'fri', label: 'Fri drive', val: o => `${o.drive_friday?.hours||'?'} hr` },
    { key: 'mon', label: 'Mon drive', val: o => `${o.drive_monday?.hours||'?'} hr` },
    { key: 'crowd', label: 'Crowd risk', val: o => o.labor_day_risk ? `${o.labor_day_risk}${o.labor_day_risk_note?` — ${o.labor_day_risk_note.slice(0,60)}…`:''}` : '—' },
    { key: 'stay', label: 'Stay from', val: o => { const s = bestStay(o); return s ? `$${s.total_3_nights} · ${s.name.split(/[,|]/)[0].trim().slice(0,28)}` : 'TBD'; } },
    { key: 'catch', label: 'The catch', val: o => (o.tradeoffs||[])[0] || o.labor_day_risk_note?.slice(0,80) || '—' },
  ];
  return `<header class="section-head"><h2>Compare at a glance</h2><p class="section-deck">Tap a column or row to drill into one destination</p></header>
  <div class="compare-wrap"><table class="compare" role="grid">
    <thead><tr><th scope="col"></th>${opts.map(o=>`<th scope="col" data-opt="${esc(o.id)}">${esc(shortName(o))}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr data-row="${r.key}">
      <th scope="row">${esc(r.label)}</th>
      ${opts.map(o=>`<td data-opt="${esc(o.id)}">${esc(r.val(o))}</td>`).join('')}
    </tr>`).join('')}
    </tbody></table></div>`;
}

function gallery(o) {
  const g = [...(o.gallery||[])];
  if (!g.length && o.hero_image) g.push({url:o.hero_image,caption:o.name});
  if (!g.length) return '';
  return `<div class="gallery">${g.map(x=>`<div class="gslide">${img(x.url,x.caption)}<span>${esc(x.caption||'')}</span></div>`).join('')}</div>
    ${o.hero_credit?`<p class="credits">Photos: ${esc(o.hero_credit)}</p>`:''}`;
}

function renderDay(d, i) {
  const blocks = d.blocks || [];
  return `<article class="day">
    ${d.image?`<header class="day-masthead">${img(d.image,d.label)}</header>`:''}
    <p class="day-kicker">Day ${i+1}</p>
    <h3 class="day-title">${esc(d.label||`Day ${i+1}`)}</h3>
    ${blocks.length?`<p class="day-summary">${esc(daySummary(blocks))}</p>`:''}
    <ol class="schedule">${blocks.map(b=>`
      <li class="block">
        <div class="block__time">${esc(fmtTime(b.time)||'')}</div>
        <div class="block__body">
          <h4 class="block__title">${esc(b.title||'')}</h4>
          ${b.activity?`<p class="block__activity">${esc(b.activity)}</p>`:''}
          <div class="block__meta">
            ${b.drive_min && b.drive_min!=='—'?`<span><strong>Drive</strong> ${esc(b.drive_min)} min</span>`:''}
            ${b.duration && b.duration!=='—'?`<span><strong>On site</strong> ${esc(b.duration)}</span>`:''}
            ${b.parking && b.parking!=='—'?`<span><strong>Parking</strong> ${esc(b.parking)}</span>`:''}
          </div>
          ${b.official_url||b.maps_url?`<div class="block__links">${b.official_url?`<a href="${esc(b.official_url)}" target="_blank" rel="noopener">Official site</a>`:''}${b.maps_url?`<a href="${esc(b.maps_url)}" target="_blank" rel="noopener">Directions</a>`:''}</div>`:''}
          ${b.backup && b.backup!=='—'?`<aside class="block__backup"><p class="backup-label">If this fills</p><p>${esc(b.backup)}</p></aside>`:''}
        </div>
      </li>`).join('')}
    </ol>
  </article>`;
}

function renderPlanCards(o, planId) {
  const plans = o.day_plans || [];
  if (!plans.length) return '';
  return `<header class="section-head"><h3>Step 2 · Pick an itinerary</h3>
    <p class="section-deck">${plans.length} plan variant${plans.length>1?'s':''} · day-by-day schedule</p></header>
    <div class="plan-cards" data-opt="${esc(o.id)}">${plans.map(p=>{
      const days = p.days || [];
      const chips = days.length
        ? days.map(d => `<span class="day-chip">${esc((d.label||'Day').replace(/,.*/,'').trim())}</span>`).join('')
        : `<span class="day-chip">TBD</span>`;
      return `<article class="plan-card${p.id===planId?' active':''}" data-plan="${esc(p.id)}" tabindex="0" role="button">
        <h4>${esc(p.name)}</h4>
        <div class="day-chips">${chips}</div>
        ${p.vibe?`<p class="plan-vibe">${esc(p.vibe)}</p>`:''}
      </article>`;
    }).join('')}</div>`;
}

function renderItineraryDays(o, planId) {
  const plan = (o.day_plans||[]).find(p => p.id === planId) || (o.day_plans||[])[0];
  if (!plan) return '';
  const days = plan.days || [];
  return `<section class="itinerary" id="itinerary-${esc(o.id)}">
    ${days.length
      ? days.map(renderDay).join('')
      : `<div class="plan-empty">Full day-by-day schedule for this variant is still being researched.<br>${plan.vibe?esc(plan.vibe):'Check back after booking.'}</div>`}
  </section>`;
}

function lodgeRow(l, pick) {
  const ctaCls = 'lodge-cta lodge-cta--ghost';
  return `<li class="lodge-row${pick?' lodge-row--pick':''}">
    <span class="lodge-rank" aria-hidden="true">${l.rank}</span>
    <div class="lodge-main">
      <div class="lodge-title">
        <h4>${l.booking_url?`<a href="${esc(l.booking_url)}" target="_blank" rel="noopener">${esc(l.name)}</a>`:esc(l.name)}</h4>
        ${pick?`<span class="lodge-status">Top pick</span>`:''}
      </div>
      <p class="lodge-meta">${esc(l.location||'')} · ${esc(l.platform||l.type||'')}</p>
      ${bedLine(l)}
      ${l.pros?`<p class="lodge-note">${esc(l.pros)}${l.cons?' · '+esc(l.cons):''}</p>`:''}
    </div>
    <div class="lodge-price">
      ${l.total_3_nights!=null?`<span class="lodge-total">$${l.total_3_nights}</span><span class="lodge-pp">3 nights${l.per_person!=null?` · $${l.per_person}/person`:''}</span>`:''}
    </div>
    ${l.booking_url?`<a class="${ctaCls}" href="${esc(l.booking_url)}" target="_blank" rel="noopener">View</a>`:''}
  </li>`;
}

function renderLodgingCollapsed(o) {
  const rows = o.lodging || [];
  if (!rows.length) return '';
  const top2 = rows.slice(0, 2);
  const rest = rows.slice(2);
  const t = DATA.meta?.travelers || {};
  return `<details class="lodge-details detail-extra">
    <summary><span>Where to stay</span><span class="label">${t.adults||3} adults · ${t.beds_min||2}+ beds</span></summary>
    <ol class="lodge-list">${top2.map(l => lodgeRow(l, l.rank===1)).join('')}</ol>
    ${rest.length?`<details><summary class="lodge-more" style="list-style:none">+ ${rest.length} more stay${rest.length>1?'s':''}</summary>
      <ol class="lodge-list">${rest.map(l => lodgeRow(l, false)).join('')}</ol>
    </details>`:''}
  </details>`;
}

function renderActivities(o) {
  const acts = o.activities || [];
  if (!acts.length) return '';
  return `<ul class="act-list">${acts.map(a=>`
    <li class="act-row">
      ${a.image?img(a.image,a.name):'<div class="img-fallback" style="width:72px;height:72px;border-radius:8px">—</div>'}
      <div>
        <div class="act-kicker">
          ${a.day?`<span class="act-day">${esc(a.day)}</span>`:''}
          <span>${esc(a.type||'activity')}</span>
          ${a.crowd_level?`<span>${esc(a.crowd_level)} crowd</span>`:''}
        </div>
        <div class="act-name">${esc(a.name)}</div>
        <div class="act-meta">${[a.duration,a.distance_mi?a.distance_mi+' mi':'',a.parking].filter(Boolean).map(esc).join(' · ')}</div>
        <div class="act-links">${a.official_url?`<a href="${esc(a.official_url)}" target="_blank" rel="noopener">Official</a>`:''}${a.maps_url?`<a href="${esc(a.maps_url)}" target="_blank" rel="noopener">Maps</a>`:''}</div>
      </div>
    </li>`).join('')}</ul>`;
}

function optionDetail(o, planId) {
  const score = o.scores?.overall?.value || 0;
  const pid = planId || defaultPlanId(o);
  return `<section class="detail" id="detail-${esc(o.id)}" data-opt="${esc(o.id)}">
    <div class="detail-head">
      <div>
        <p class="label">Step 2 · ${esc(shortName(o))}</p>
        <h2>${esc(o.name)}</h2>
        <p class="prose muted" style="margin:4px 0 0">${esc(o.tagline||'')}</p>
      </div>
    </div>
    ${renderPlanCards(o, pid)}
    <div class="itinerary-zone" id="itinerary-zone-${esc(o.id)}">${renderItineraryDays(o, pid)}</div>
    ${renderLodgingCollapsed(o)}
    <details class="detail-extra">
      <summary><span>Map &amp; photos</span></summary>
      ${gallery(o)}
      <div class="map" id="map-${esc(o.id)}"></div>
    </details>
    ${(o.reviews||[]).length?`<details class="detail-extra">
      <summary><span>What travelers say</span><span class="label">${o.reviews.length} review${o.reviews.length>1?'s':''}</span></summary>
      ${o.reviews.map(r=>`<blockquote class="review"><p>${esc(r.quote)}</p><cite><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.source)}</a></cite></blockquote>`).join('')}
    </details>`:''}
    ${o.reality_check&&(o.reality_check.parking_targets?.length||o.reality_check.reservations?.length||o.reality_check.safety?.length)?`
    <details class="detail-extra">
      <summary><span>Before you go</span></summary>
      <div class="reality">
        ${o.reality_check.parking_targets?.length?`<p><strong>Parking:</strong> ${o.reality_check.parking_targets.map(esc).join('; ')}</p>`:''}
        ${o.reality_check.reservations?.length?`<p><strong>Book ahead:</strong> ${o.reality_check.reservations.map(esc).join('; ')}</p>`:''}
        ${o.reality_check.safety?.length?`<p><strong>Safety:</strong> ${o.reality_check.safety.map(esc).join('; ')}</p>`:''}
      </div>
    </details>`:''}
    <details class="detail-extra act-ref">
      <summary><span>Activity reference</span><span class="label">${(o.activities||[]).length} stops</span></summary>
      ${renderActivities(o)}
    </details>
    <div class="stats" style="margin-top:var(--space-6)">
      <div class="stat"><span class="label">Friday drive</span><strong>${esc(o.drive_friday?.hours||'?')} hr</strong></div>
      <div class="stat"><span class="label">Monday return</span><strong>${esc(o.drive_monday?.hours||'?')} hr</strong></div>
      <div class="stat"><span class="label">Overall</span><strong>${score||'—'}/5</strong><div class="score-bar"><div class="score-fill" style="width:${(score/5)*100}%"></div></div></div>
    </div>
    ${o.strengths?.length?`<p class="prose"><strong>Strengths:</strong> ${o.strengths.map(esc).join(' · ')}</p>`:''}
    ${o.tradeoffs?.length?`<p class="prose muted"><strong>Tradeoffs:</strong> ${o.tradeoffs.map(esc).join(' · ')}</p>`:''}
  </section>`;
}

function dockBar() {
  const mapUrl = DATA.meta?.trip_map_url;
  return `<button type="button" class="dock-btn" data-dock="compare">Compare</button>
    ${mapUrl
      ? `<a class="dock-btn dock-btn--map" href="${esc(mapUrl)}" target="_blank" rel="noopener">Trip map</a>`
      : `<span class="dock-btn dock-btn--disabled" aria-disabled="true">Trip map</span>`}`;
}

function parseHash() {
  const raw = (location.hash || '').replace(/^#/, '');
  if (!raw || raw === 'compare') return { mode: 'compare', optionId: null, planId: null };
  const parts = raw.split('/');
  const optionId = parts[0] || null;
  const o = getOption(optionId);
  if (!o) return { mode: 'compare', optionId: null, planId: null };
  const planId = parts[1] || defaultPlanId(o);
  const validPlan = (o.day_plans||[]).some(p => p.id === planId);
  return { mode: 'weekend', optionId, planId: validPlan ? planId : defaultPlanId(o) };
}

function syncHash() {
  let hash = 'compare';
  if (state.mode === 'weekend' && state.optionId) {
    hash = state.optionId;
    if (state.planId && state.planId !== defaultPlanId(getOption(state.optionId))) hash += '/' + state.planId;
    else if (state.planId) hash += '/' + state.planId;
  }
  const next = '#' + hash;
  if (location.hash !== next) history.replaceState(null, '', next);
}

function initMap(o) {
  const el = document.getElementById('map-' + o.id);
  if (!el || typeof L === 'undefined' || maps[o.id]) return;
  const map = L.map(el, { scrollWheelZoom: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM' }).addTo(map);
  const pts = [];
  (o.activities || []).forEach(a => {
    if (typeof a.lat === 'number') { L.marker([a.lat, a.lng]).addTo(map).bindPopup(esc(a.name)); pts.push([a.lat, a.lng]); }
  });
  if (pts.length) map.fitBounds(pts, { padding: [28, 28] });
  else map.setView([39.2, -120.5], 7);
  maps[o.id] = map;
}

function refreshPlanUI(o, planId) {
  const zone = document.getElementById('itinerary-zone-' + o.id);
  if (zone) zone.innerHTML = renderItineraryDays(o, planId);
  document.querySelectorAll(`.plan-cards[data-opt="${o.id}"] .plan-card`).forEach(c => {
    c.classList.toggle('active', c.dataset.plan === planId);
  });
}

function applyState(scroll) {
  document.body.classList.toggle('mode-compare', state.mode === 'compare');
  document.body.classList.toggle('mode-weekend', state.mode === 'weekend');

  document.querySelectorAll('.chip').forEach(chip => {
    const on = state.mode === 'weekend' && chip.dataset.chip === state.optionId;
    chip.classList.toggle('active', on);
  });

  document.querySelectorAll('.opt-card').forEach(c => {
    c.classList.toggle('active', state.mode === 'weekend' && c.dataset.id === state.optionId);
  });

  document.querySelectorAll('.compare thead th[data-opt], .compare td[data-opt]').forEach(cell => {
    cell.classList.toggle('col-active', state.mode === 'weekend' && cell.dataset.opt === state.optionId);
  });

  document.querySelectorAll('.detail').forEach(d => {
    d.classList.toggle('active', state.mode === 'weekend' && d.dataset.opt === state.optionId);
  });

  document.querySelectorAll('.dock-btn[data-dock="compare"]').forEach(b => {
    b.classList.toggle('active', state.mode === 'compare');
  });

  if (state.mode === 'weekend' && state.optionId) {
    const o = getOption(state.optionId);
    if (o) {
      refreshPlanUI(o, state.planId || defaultPlanId(o));
      setTimeout(() => {
        initMap(o);
        maps[o.id]?.invalidateSize();
      }, 200);
      if (scroll) document.getElementById('detail-' + state.optionId)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  } else if (scroll) {
    document.getElementById('compare-panel')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  syncHash();
}

function goCompare(scroll) {
  state.mode = 'compare';
  state.optionId = null;
  state.planId = null;
  applyState(scroll);
}

function goOption(optionId, planId, scroll) {
  const o = getOption(optionId);
  if (!o) return;
  state.mode = 'weekend';
  state.optionId = optionId;
  state.planId = planId || defaultPlanId(o);
  applyState(scroll);
}

function goPlan(planId) {
  if (state.mode !== 'weekend' || !state.optionId) return;
  state.planId = planId;
  applyState(false);
  syncHash();
}

function bind() {
  document.querySelectorAll('.chip').forEach(chip => {
    chip.onclick = () => goOption(chip.dataset.chip, null, true);
  });

  document.querySelectorAll('.opt-card').forEach(c => {
    const open = () => goOption(c.dataset.id, null, true);
    c.onclick = open;
    c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } };
  });

  document.querySelectorAll('.compare [data-opt]').forEach(cell => {
    cell.onclick = () => goOption(cell.dataset.opt, null, true);
  });

  document.addEventListener('click', e => {
    const card = e.target.closest('.plan-card');
    if (!card) return;
    const wrap = card.closest('.plan-cards');
    if (!wrap) return;
    goPlan(card.dataset.plan);
  });

  document.querySelector('[data-dock="compare"]')?.addEventListener('click', () => goCompare(true));

  window.addEventListener('hashchange', () => {
    Object.assign(state, parseHash());
    applyState(false);
  });
}

document.getElementById('app').innerHTML =
  hero() +
  chromeBar() +
  `<div id="compare-panel">${optionCards()}${compareTable()}${DATA.group_message?`<header class="section-head"><h2>Group message</h2></header><div class="group-msg">${esc(DATA.group_message)}</div>`:''}</div>` +
  `<div id="detail-panel" class="detail-zone">${(DATA.options||[]).map(o => optionDetail(o, defaultPlanId(o))).join('')}</div>` +
  `<footer>Generated ${esc(DATA.meta?.generated_at?.slice(0,10)||'')} · travel-agent</footer>`;

document.getElementById('dock').innerHTML = dockBar();

Object.assign(state, parseHash());
bind();
applyState(false);
</script>
</body>
</html>
